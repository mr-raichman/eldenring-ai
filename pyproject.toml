[project]
name = "eldenring-ai"
version = "0.1.0"
description = "Reinforcement learning agent (PPO) that plays Elden Ring to defeat Margit."
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "torch==2.11.0+cu128",
    "stable-baselines3==2.8.0",
    "gymnasium==1.2.3",
    "numpy==2.4.3",
    "opencv-python==4.13.0.92",
    "evdev==1.9.3",
    "tensorboard==2.20.0",
    "tqdm==4.67.3",
    "rich>=15.0.0",
    "plotext>=5.3.2",
]

[project.scripts]
eldenring-train = "eldenring_ai.rl.train:train"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eldenring_ai"]

# Torch's CUDA 12.8 build is not on PyPI; pull it from the PyTorch index.
# `explicit = true` means this index is used only for packages that name it
# below, so everything else still resolves from PyPI.
[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
# Collect only real automated tests. Interactive diagnostics live in tools/
# and must never be collected (they open the camera / prompt for input).
testpaths = ["tests"]
addopts = "-q"
